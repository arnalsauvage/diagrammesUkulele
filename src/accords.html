<!DOCTYPE html>
<html lang="fr">
<head>
    <title>Grille d'accords Ukulélé</title>
    <meta name="description" content="Créez vos grilles d'accords de ukulélé personnalisées en quelques clics. Un outil pratique et rapide proposé par l'association musicale Canopée.">
    <meta charset="utf-8" />
    <link rel="icon" type="image/webp" href="https://ateliers.canopee-musique.fr/assets/images/logo-canopee.webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet" />
</head>
<body>
    <div class="lang-selector">
        <img src="./images/fr.png" class="lang-flag" data-lang="fr" alt="Français">
        <img src="./images/gb.png" class="lang-flag" data-lang="en" alt="English">
    </div>

    <h1 data-i18n="generatorTitle">Générateur de Grille d'Accords</h1>
    
    <div class="nav-links">
        <a href="index.html" data-i18n="navToAtelier">&larr; Retour à l'atelier</a>
    </div>

    <main class="main-container grid-page">
        <div class="grid-controls">
            <p data-i18n="inputPlaceholder">Saisissez vos accords séparés par des espaces :</p>
            <textarea id="accordsSaisis">C C#dim7 Dm7 G7</textarea>
            <button class="leBouton" id="btnMajAccords" data-i18n="generate">Générer la grille</button>
        </div>

        <div id="listeAccords"></div>
    </main>

    <!-- Scripts -->
    <script type="module" src="./js/pageAccords.js"></script>

<footer>
    <div class="footer-content">
        <img src="https://ateliers.canopee-musique.fr/assets/images/logo-canopee.webp" alt="Logo Canopée" class="footer-logo">
        <p>Canopee Musique - Partoches :</p>
        <div class="footer-links">
            <a href="https://canopee-musique.fr" target="_blank">Site web</a>
            <a href="http://partoches.canopee-musique.fr" target="_blank">Partoches</a>
            <a href="https://ateliers.canopee-musique.fr" target="_blank">Ateliers uku en ligne</a>
        </div>
        
        <div class="footer-socials">
            <a href="https://www.youtube.com/@ArnaudMedina" target="_blank" title="YouTube">
                <img src="https://upload.wikimedia.org/wikipedia/commons/0/09/YouTube_full-color_icon_%282017%29.svg" alt="YouTube">
            </a>
            <a href="https://bsky.app/profile/arnaud-ukulele.bsky.social" target="_blank" title="Bluesky">
                <img src="https://upload.wikimedia.org/wikipedia/commons/7/7a/Bluesky_Logo.svg" alt="Bluesky">
            </a>
        </div>

        <div class="footer-legal">
            <span id="app-version"></span>
            <a href="#" target="_blank">Mentions légales</a>
            <a href="#" target="_blank">Mercis</a>
        </div>
    </div>
</footer>

</body>
</html>
