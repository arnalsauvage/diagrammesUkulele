<!DOCTYPE html>
<html lang="fr">
<head>
    <title>Grille d'accords Ukulélé</title>
    <meta charset="utf-8" />
    <link rel="icon" type="image/webp" href="https://ateliers.canopee-musique.fr/assets/images/logo-canopee.webp">
    <link href="style.css" rel="stylesheet" />
    <style>
        .grid-controls {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            text-align: center;
        }
        #accordsSaisis {
            width: 100%;
            max-width: 600px;
            height: 80px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: monospace;
            font-size: 1.1rem;
            margin-bottom: 15px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        #listeAccords {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }
    </style>
</head>
<body>
    <div class="lang-selector">
        <img src="https://flagcdn.com/w40/fr.png" class="lang-flag" data-lang="fr" alt="Français">
        <img src="https://flagcdn.com/w40/gb.png" class="lang-flag" data-lang="en" alt="English">
    </div>

    <h1 data-i18n="generatorTitle">Générateur de Grille d'Accords</h1>
    
    <div class="nav-links">
        <a href="index.html" data-i18n="navToAtelier">&larr; Retour à l'atelier</a>
    </div>

    <div class="main-container" style="display: block">
        <div class="grid-controls">
            <p data-i18n="inputPlaceholder">Saisissez vos accords séparés par des espaces :</p>
            <textarea id="accordsSaisis">C C#dim7 Dm7 G7</textarea>
            <button class="leBouton" id="btnMajAccords" data-i18n="generate">Générer la grille</button>
        </div>

        <div id="listeAccords"></div>
    </div>

    <!-- Scripts -->
    <script type="module" src="./js/pageAccords.js"></script>

<footer>
    <div class="footer-content">
        <img src="https://ateliers.canopee-musique.fr/assets/images/logo-canopee.webp" alt="Logo Canopée" class="footer-logo">
        <p>Canopee Musique - Partoches :</p>
        <div class="footer-links">
            <a href="https://canopee-musique.fr" target="_blank">Site web</a> |
            <a href="http://partoches.canopee-musique.fr" target="_blank">Partoches</a> |
            <a href="https://ateliers.canopee-musique.fr" target="_blank">Ateliers uku en ligne</a>
        </div>
        
        <div class="footer-socials">
            <a href="https://www.youtube.com/@ArnaudMedina" target="_blank" title="YouTube">
                <img src="https://upload.wikimedia.org/wikipedia/commons/0/09/YouTube_full-color_icon_%282017%29.svg" width="30" height="30" alt="YouTube" style="vertical-align:middle;">
            </a>
            |
            <a href="https://bsky.app/profile/arnaud-ukulele.bsky.social" target="_blank" title="Bluesky">
                <img src="https://upload.wikimedia.org/wikipedia/commons/7/7a/Bluesky_Logo.svg" width="30" height="30" alt="Bluesky" style="vertical-align:middle;">
            </a>
        </div>

        <div class="footer-legal">
            <span id="app-version" style="display:block; margin-bottom: 10px; font-weight: bold; color: var(--primary-color);"></span>
            <a href="#" target="_blank">Mentions légales</a> |
            <a href="#" target="_blank">Mercis</a>
        </div>
    </div>
</footer>

</body>
</html>
