<!DOCTYPE html>
<html lang="fr">
<head>
    <title>Atelier Diagrammes Ukulélé</title>
    <meta charset="utf-8"/>
    <link rel="icon" type="image/webp" href="https://ateliers.canopee-musique.fr/assets/images/logo-canopee.webp">
    <link href="./style.css" rel="stylesheet"/>
</head>
<body>

<header class="main-header">
    <div class="header-logo-container">
        <img src="https://ateliers.canopee-musique.fr/assets/images/logo-canopee.webp" alt="Logo Canopée" class="header-logo">
    </div>
    
    <h1 data-i18n="title">Atelier Diagrammes Ukulélé</h1>

    <div class="lang-selector">
        <img src="https://flagcdn.com/w40/fr.png" class="lang-flag" data-lang="fr" alt="Français">
        <img src="https://flagcdn.com/w40/gb.png" class="lang-flag" data-lang="en" alt="English">
    </div>
</header>

<div class="nav-links">
    <a href="./accords.html" data-i18n="navToGrid">Aller à la page Grille &rarr;</a>
</div>

<div class="main-container">
    <!-- Section de gauche : Le Diagramme -->
    <section class="canvas-section">
        <div class="canvas-container">
            <span id="favorite-toggle" class="main-favorite-star" title="">☆</span>
            <canvas id="diagramme1" height="330" width="190"></canvas>
        </div>
        
        <!-- Affichage des notes calculées -->
        <div id="string-notes-display" style="display: flex; gap: 15px; margin-top: 10px; font-family: monospace; font-weight: bold; font-size: 1.2rem; background: #eee; padding: 5px 15px; border-radius: 20px;">
            <span>G</span><span>C</span><span>E</span><span>A</span>
        </div>

        <!-- Affichage de l'analyse d'accord -->
        <div id="chord-analysis-display" style="margin-top: 10px; font-size: 0.9rem; color: #666; font-style: italic;">
        </div>

        <!-- Zone des alternatives miniatures -->
        <div id="alternatives-title" style="margin-top: 20px; font-size: 0.85rem; color: #555; font-weight: bold; display: none;"></div>
        <div id="alternatives-container">
        </div>

        <div id="popupMessage" style="display:none; margin-top: 15px; background-color:#f8d7da; color:#721c24; padding:15px; border:1px solid #f5c6cb; border-radius:5px;">
            <p style="margin:0" data-i18n="errorFret">⚠️ La case de départ choisie ne permet pas d'afficher toutes les notes.</p>
        </div>

        <div class="button-bar">
            <a class="leBouton" id="download" download="ukulele-chord.png" data-i18n="download">Download Image</a>
            <button class="leBouton secondary" id="btn-share" data-i18n="share">🔗 Partager</button>
        </div>
    </section>

    <!-- Section de droite : Les Contrôles -->
    <section class="controls-section">
        
        <div class="control-group">
            <h3 data-i18n="chordDefinition">Chord Definition</h3>
            <div class="form-group">
                <label for="name" data-i18n="name">Name:</label>
                <input id="name" maxlength="12" name="name" type="text" value="Dm"/>
                <img alt="info" class="infobulle-icone" height="16" id="loupeChercheAccordParNom" src="./images/petite-info-bulle.png" width="16"/>
                <img src="./images/cle-de-sol.svg" id="toggle-assistant" style="cursor: pointer; height: 36px; width: auto; margin-left: 10px; vertical-align: middle;" title="Assistant" alt="Assistant">
                <div class="infobulle-texte" id="aide_nomaccord" style="display: none" data-i18n="helpName">
                </div>
            </div>

            <!-- Assistant de nom d'accord -->
            <div class="chord-assistant" id="chord-assistant" style="display: none">
                <div class="assistant-row" id="assistant-roots">
                    <button class="mini-btn" data-val="C">C</button>
                    <button class="mini-btn" data-val="D">D</button>
                    <button class="mini-btn" data-val="E">E</button>
                    <button class="mini-btn" data-val="F">F</button>
                    <button class="mini-btn" data-val="G">G</button>
                    <button class="mini-btn" data-val="A">A</button>
                    <button class="mini-btn" data-val="B">B</button>
                </div>
                <div class="assistant-row" id="assistant-accidentals">
                    <button class="mini-btn secondary" data-val="">♮</button>
                    <button class="mini-btn secondary" data-val="#">#</button>
                    <button class="mini-btn secondary" data-val="b">b</button>
                </div>
                <div class="assistant-row" id="assistant-families">
                    <button class="mini-btn family" data-val="">Maj</button>
                    <button class="mini-btn family" data-val="m">m</button>
                    <button class="mini-btn family" data-val="7">7</button>
                    <button class="mini-btn family" data-val="m7">m7</button>
                    <button class="mini-btn family" data-val="7M">7M</button>
                    <button class="mini-btn family" data-val="m7M">m7M</button>
                    <button class="mini-btn family" data-val="sus2">sus2</button>
                    <button class="mini-btn family" data-val="sus4">sus4</button>
                    <button class="mini-btn family" data-val="dim">dim</button>
                    <button class="mini-btn family" data-val="dim7">dim7</button>
                    <button class="mini-btn family" data-val="aug">aug</button>
                    <button class="mini-btn family" data-val="6">6</button>
                    <button class="mini-btn family" data-val="m6">m6</button>
                    <button class="mini-btn family" data-val="5">5</button>
                </div>
            </div>

            <div class="form-group">
                <label for="valeurs" data-i18n="position">Position:</label>
                <input id="valeurs" maxlength="12" name="valeurs" type="text" value="2210"/>
                <img alt="info" class="infobulle-icone" height="16" id="infobulle" src="./images/petite-info-bulle.png" width="16"/>
                <div class="infobulle-texte" id="aide_valeur" style="display: none" data-i18n="helpValue">
                </div>
            </div>

            <div class="form-group">
                <label for="caseDepartAuto" data-i18n="autoFret">Auto Fret:</label>
                <input checked id="caseDepartAuto" type="checkbox"/>
                <input id="caseDepart" max="12" min="1" style="display: none; margin-left: 10px; width: 60px" type="number" value="1"/>
            </div>
            
            <div class="button-bar" style="justify-content: flex-start">
                <button class="leBouton" id="btnPrecChord" data-i18n="prev">&larr; Prev</button>
                <button class="leBouton" id="randomChord" data-i18n="random">Random</button>
                <button class="leBouton" id="btnNextChord" data-i18n="next">Next &rarr;</button>
                <button class="leBouton secondary" id="btnGenerateData" style="font-size: 0.7rem; padding: 5px" title="Générer DB">⚙️ DB</button>
            </div>
        </div>

        <div class="control-group">
            <h3 style="display: flex; align-items: center; justify-content: space-between;">
                <span data-i18n="appearance">Appearance</span>
                <span id="toggle-colors" style="cursor: pointer; font-size: 1.2rem;" title="Couleurs">🎨</span>
            </h3>
            <div class="form-group">
                <label for="fader" data-i18n="size">Size:</label>
                <input id="fader" max="70" min="20" name="ftempo" step="1" type="range" value="40"/>
                <output id="taille" style="margin-left: 10px; font-weight: bold">40</output>
            </div>
            
            <div id="color-controls" style="display: none; border-top: 1px solid #eee; padding-top: 10px; margin-top: 5px;">
                <div class="form-group">
                    <label for="couleurRemplissage" data-i18n="dotFill">Dot Fill:</label>
                    <input id="couleurRemplissage" type="color" value="#FF5555"/>
                </div>
                <div class="form-group">
                    <label for="couleurTrait" data-i18n="dotOutline">Dot Outline:</label>
                    <input id="couleurTrait" type="color" value="#111111"/>
                </div>
                <div class="form-group">
                    <label for="couleurGrille" data-i18n="gridColor">Grid Color:</label>
                    <input id="couleurGrille" type="color" value="#333333"/>
                </div>
                <div class="form-group">
                    <label for="couleurReperes" data-i18n="markers">Markers:</label>
                    <input id="couleurReperes" type="color" value="#FFBBBB"/>
                </div>

                <!-- Gestion des palettes personnalisées -->
                <div class="custom-palettes" style="margin-top: 15px; border-top: 1px dashed #ccc; padding-top: 10px;">
                    <p style="font-size: 0.8rem; font-weight: bold; margin-bottom: 8px;">Mes Palettes (max 3) :</p>
                    <div id="palettes-list" style="display: flex; gap: 10px; margin-bottom: 10px;">
                        <!-- Les palettes s'afficheront ici -->
                    </div>
                    <div class="save-palette-form" id="save-palette-area" style="display: flex; gap: 5px;">
                        <input type="text" id="new-palette-name" placeholder="Nom de la palette" style="font-size: 0.8rem; padding: 4px; flex: 1;">
                        <button class="leBouton secondary" id="btn-save-palette" style="font-size: 0.7rem; padding: 5px 10px;">Enregistrer</button>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>

<!-- Scripts -->
<script type="module" src="./js/main.js"></script>

<footer>
    <div class="footer-content">
        <img src="https://ateliers.canopee-musique.fr/assets/images/logo-canopee.webp" alt="Logo Canopée" class="footer-logo">
        <p>Canopee Musique </p>
        <div class="footer-links">
            <a href="https://canopee-musique.fr" target="_blank">Site web</a>
            <a href="http://partoches.canopee-musique.fr" target="_blank">Partoches</a>
            <a href="https://ateliers.canopee-musique.fr" target="_blank">Ateliers uku en ligne</a>
        </div>
        
        <div class="footer-socials">
            <a href="https://www.youtube.com/@ArnaudMedina" target="_blank" title="YouTube">
                <img src="https://upload.wikimedia.org/wikipedia/commons/0/09/YouTube_full-color_icon_%282017%29.svg" alt="YouTube">
            </a>
            <a href="https://bsky.app/profile/arnaud-ukulele.bsky.social" target="_blank" title="Bluesky">
                <img src="https://upload.wikimedia.org/wikipedia/commons/7/7a/Bluesky_Logo.svg" alt="Bluesky">
            </a>
        </div>

        <div class="footer-legal">
            <span id="app-version" style="font-weight: bold; color: var(--primary-color);"></span>
            <a href="#" target="_blank">Mentions légales</a>
            <a href="#" target="_blank">Mercis</a>
        </div>
    </div>
</footer>

</body>
</html>
